[workspace]
members = ["crates/seacraft-core", "crates/seacraft-cli", "crates/seacraft-gui", "xtask"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["SeaCraft contributors"]
repository = "https://github.com/havan/SeaCraft"
description = "Hull modelling, hydrostatics and stability in Rust, compatible with FREE!ship .fef files"
readme = "README.md"
keywords = ["naval-architecture", "hull", "hydrostatics", "cad", "subdivision"]
categories = ["science", "simulation"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
