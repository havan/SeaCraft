[package]
name = "seacraft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Hull modelling kernel, hydrostatics and stability for SeaCraft"

[dependencies]
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
serde_json.workspace = true

# The control token's randomness, which Unix reads from /dev/urandom.
[target.'cfg(not(unix))'.dependencies]
getrandom = "0.4"

# A write under the control channel's write roots opens each folder relative to the one before.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

